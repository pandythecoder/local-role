<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oliver Anime Studio</title>

<style>
  body {
    margin: 0;
    background: #0d0d0d;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* LEFT PANEL: CANVAS + TOOLBAR */
  #left {
    flex: 3;
    display: flex;
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
  }

  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  #toolbar button, #toolbar select, #toolbar input {
    background: #1a1a1a;
    color: #eee;
    border: 1px solid #333;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }

  #canvas-area {
    flex: 1;
    border: 1px solid #333;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    background: #222;
  }

  /* RIGHT PANEL: LAYERS + TIMELINE */
  #right {
    flex: 2;
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-left: 1px solid #333;
    box-sizing: border-box;
  }

  #layers {
    margin-bottom: 10px;
  }

  #layers h2, #timeline h2 {
    margin: 0 0 5px 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #layer-list {
    background: #181818;
    border: 1px solid #333;
    padding: 5px;
    min-height: 60px;
  }

  .layer {
    background: #222;
    border: 1px solid #555;
    padding: 4px 6px;
    margin-bottom: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  .layer.active {
    background: #3a6;
    border-color: #6f9;
  }

  #timeline {
    flex: 1;
    background: #181818;
    border: 1px solid #333;
    display: flex;
    flex-direction: column;
  }

  #timeline-controls {
    padding: 5px;
    border-bottom: 1px solid #333;
    display: flex;
    gap: 10px;
  }

  #frames {
    flex: 1;
    display: flex;
    overflow-x: auto;
    gap: 4px;
    padding: 5px;
  }

  .frame {
    width: 28px;
    height: 45px;
    background: #222;
    border: 1px solid #555;
    font-size: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .frame.active {
    background: #36a;
    border-color: #6af;
  }
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div id="left">

  <!-- TOOLBAR -->
  <div id="toolbar">

    <!-- Drawing tools -->
    <button data-tool="pencil">Pencil</button>
    <button data-tool="pen">Pen</button>
    <button data-tool="marker">Marker</button>
    <button data-tool="airbrush">Airbrush</button>
    <button data-tool="glow">Glow</button>
    <button data-tool="shade">Shade</button>
    <button data-tool="smudge">Smudge</button>
    <button data-tool="fill">Fill</button>

    <!-- Shapes -->
    <button data-tool="line">Line</button>
    <button data-tool="rect">Rect</button>
    <button data-tool="circle">Circle</button>

    <!-- Modes -->
    <select id="mode">
      <option value="normal">Normal</option>
      <option value="anime">Anime Mode</option>
      <option value="paint">Painting Mode</option>
      <option value="effects">Effects Mode</option>
      <option value="multiply">Multiply</option>
      <option value="screen">Screen</option>
      <option value="overlay">Overlay</option>
    </select>

    <!-- Brush settings -->
    <label>Size:
      <input type="range" id="size" min="1" max="60" value="8">
